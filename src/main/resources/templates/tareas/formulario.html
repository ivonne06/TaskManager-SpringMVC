
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de tareas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/tareas}">TaskManager</a>
    </div>
</nav>

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"
                        th:text="${tarea.id == null ? 'Nueva tarea' : 'Editar tarea'}">
                        Formulario
                    </h4>
                </div>

                <div class="card-body">

                    <form th:action="@{/tareas/guardar}"
                          th:object="${tarea}"
                          method="post">

                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label">Título</label>

                            <input type="text"
                                   th:field="*{titulo}"
                                   class="form-control"
                                   maxlength="100"
                                   placeholder="Ingrese el título"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descripción</label>

                            <textarea th:field="*{descripcion}"
                                      class="form-control"
                                      rows="4"
                                      maxlength="255"
                                      placeholder="Describa la tarea"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Estado</label>

                            <select th:field="*{estado}" class="form-select">
                                <option value="PENDIENTE">Pendiente</option>
                                <option value="EN PROGRESO">En progreso</option>
                                <option value="COMPLETADA">Completada</option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/tareas}" class="btn btn-secondary">
                                Cancelar
                            </a>

                            <button type="submit" class="btn btn-primary">
                                Guardar tarea
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
