services:
  mysql:
    image: mysql:8.4
    container_name: taskmanager-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL__PASSWORD}
      MYSQL_DATABASE: gestion_tareas
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: taskmanager-app
    restart: unless-stopped
    ports:
      - '8081:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/gestion_tareas
      SPRING_DATASOURCE_USERNAME: ${MYSQL__USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL__PASSWORD}
    depends_on:
      - mysql

volumes:
  mysql_data:
